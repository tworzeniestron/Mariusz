<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamiczne dodawanie elementów</title>
<style>
    /* Styl dla przykładowego przycisku */
    .add-remove-btn {
        padding: 10px;
        background-color: #007bff;
        color: #fff;
        border: none;
        cursor: pointer;
    }
</style>
</head>
<body>

<div id="container">
    <!-- Tutaj zostaną dodane dynamicznie utworzone elementy -->
</div>

<button id="addBtn" class="add-remove-btn">Dodaj element</button>
<button id="removeBtn" class="add-remove-btn">Usuń ostatni element</button>

<!-- Formularz logowania -->
<div id="loginForm">
    <h2>Logowanie</h2>
    <input type="text" id="username" placeholder="Nazwa użytkownika"><br>
    <input type="password" id="password" placeholder="Hasło"><br>
    <button id="loginBtn">Zaloguj</button>
    <p id="loginError" style="color: red; display: none;">Błędna nazwa użytkownika lub hasło.</p>
    <p>Nie masz jeszcze konta? <a href="#" id="registerLink">Zarejestruj się</a></p>
</div>

<!-- Formularz rejestracji -->
<div id="registerForm" style="display: none;">
    <h2>Rejestracja</h2>
    <input type="text" id="newUsername" placeholder="Nowa nazwa użytkownika"><br>
    <input type="password" id="newPassword" placeholder="Nowe hasło"><br>
    <button id="registerBtn">Zarejestruj</button>
    <p id="registerError" style="color: red; display: none;">Nie można zarejestrować nowego użytkownika.</p>
</div>

<script>
    var addBtn = document.getElementById('addBtn');
    var removeBtn = document.getElementById('removeBtn');
    var container = document.getElementById('container');
    var loginForm = document.getElementById('loginForm');
    var registerForm = document.getElementById('registerForm');
    var loginError = document.getElementById('loginError');
    var registerError = document.getElementById('registerError');

    // Sprawdź, czy użytkownik jest zalogowany
    var isLoggedIn = false;

    // Funkcja logowania użytkownika
    function loginUser(username, password) {
        // Wysyłanie danych logowania do serwera
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "login.php", true);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    // Udana autoryzacja
                    isLoggedIn = true;
                    showElement(addBtn);
                    showElement(removeBtn);
                    hideElement(loginForm);
                } else {
                    // Błąd logowania
                    loginError.style.display = 'block';
                }
            }
        };
        xhr.send("username=" + encodeURIComponent(username) + "&password=" + encodeURIComponent(password));
    }

    // Funkcja rejestracji nowego użytkownika
    function registerUser(username, password) {
        // Wysyłanie danych rejestracji do serwera
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "register.php", true);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    // Udana rejestracja
                    alert("Nowy użytkownik został zarejestrowany. Proszę się zalogować.");
                    showElement(loginForm);
                    hideElement(registerForm);
                } else {
                    // Błąd rejestracji
                    registerError.style.display = 'block';
                }
            }
        };
        xhr.send("username=" + encodeURIComponent(username) + "&password=" + encodeURIComponent(password));
    }

    // Funkcja wylogowywania użytkownika
    function logoutUser() {
        isLoggedIn = false;
        hideElement(addBtn);
        hideElement(removeBtn);
        showElement(loginForm);
        // Wyczyść pola formularza logowania
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }

    // Dodawanie elementu po kliknięciu przycisku
    addBtn.addEventListener('click', function() {
        if (isLoggedIn) {
            var newElement = document.createElement('div');
            newElement.textContent = 'Nowy element';
            container.appendChild(newElement);
            // Wysyłanie danych do serwera przy dodawaniu elementu
            sendDataToServer("tekst", "Nowy element");
        } else {
            alert("Musisz być zalogowany, aby dodać element.");
        }
    });

    // Usuwanie ostatniego elementu po kliknięciu przycisku
    removeBtn.addEventListener('click', function() {
        if (container.children.length > 0) {
            container.removeChild(container.lastChild);
        }
    });

    // Funkcja wysyłająca dane do serwera
    function sendDataToServer(typElementu, tresc) {
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "zapisz_dane.php", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                console.log("Dane zostały zapisane na serwerze.");
            }
        };
        var data = {
            "typ_elementu": typElementu,
            "tresc": tresc
        };
        xhr.send(JSON.stringify(data));
    }

    // Funkcja wyświetlająca element
    function showElement(element) {
        element.style.display = 'block';
    }

    // Funkcja ukrywająca element
    function hideElement(element) {
        element.style.display = 'none';
    }

    // Obsługa zdarzenia logowania po kliknięciu przycisku "Zaloguj"
    document.getElementById('loginBtn').addEventListener('click', function() {
        var username = document.getElementById('username').value;
        var password = document.getElementById('password').value;
        // Wywołaj funkcję logowania użytkownika
        loginUser(username, password);
    });

    // Obsługa zdarzenia rejestracji po kliknięciu przycisku "Zarejestruj"
    document.getElementById('registerBtn').addEventListener('click', function() {
        var newUsername = document.getElementById('newUsername').value;
        var newPassword = document.getElementById('newPassword').value;
        // Wywołaj funkcję rejestracji nowego użytkownika
        registerUser(newUsername, newPassword);
    });

    // Wyświetlanie formularza rejestracji po kliknięciu linku "Zarejestruj się"
    document.getElementById('registerLink').addEventListener('click', function() {
        showElement(registerForm);
        hideElement(loginForm);
    });
</script>

</body>
</html>
