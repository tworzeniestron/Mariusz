<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz kontaktowy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css" integrity="sha512-HK5fgLBL+xu6dm/Ii3z4xhlSUyZgTT9tuc/hSrtw6uzJOvgRr2a9jyxxT1ely+B+xFAmJKVSTbpM/CuL7qxO8w==" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href='https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;700&display=swap' rel='stylesheet'>
    <link rel="stylesheet" href="./css/contact.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" media="screen and (max-width: 399px) " href="/css/contactSmart.css">
    <link rel="stylesheet" media="screen and (min-width: 400px) and (max-width: 749px) " href="./css/contactMobile.css">
    <meta name="author" content="Piotr Markiewicz">
</head>

<body>
    <div class="wrapper">    
        <form id="myForm" action="mail.php" method="post" class="contact-form">
            <h1 style="text-align: center;">Kontakt:</h1>
            <div class="contact-box">
                <label for="fullName">Imię i Nazwisko</label>
                <input name="fullName" type="text" id="fullName" placeholder="Podaj imię i nazwisko">
                <p class="error-text">error</p>
            </div>
            <div class="contact-box">
                <label for="email">Adres e-mail</label>
                <input name="email" type="email" id="email" placeholder="Podaj adres mailowy">
                <p class="error-text">error</p>
            </div>
            <div class="contact-box">
                <label for="phone">Telefon</label>
                <input name="phone" type="tel" id="phone" placeholder="Podaj numer telefonu">
                <p class="error-text">error</p>
            </div>
            <div class="contact-box">
                <label for="message">Treść wiadomości</label>
                <textarea name="message" id="message" placeholder="Napisz proszę w jakiej sprawie się kontaktujesz"></textarea>
                <p class="error-text">error</p>
            </div>
            <div class="control-buttons">
                <button type="button" id="back" class="back btn"><a href="/">Wróć na stronę główną</a></button>
                <button type="reset" id="clear" class="clear btn">Wyczyść</button>
                <button type="submit" id="send" class="send btn">Wyślij</button>
            </div>
            <div class="sendMsg">
                <h2>Formularz został poprawnie wysłany!</h2>
                <button class="close">Potwierdź</button>
            </div>
        </form>
    </div>

    <div id="policy">
        <div class="cookie-box">
            <p>Ta strona używa plików cookie, aby zapewnić najlepszą jakość usług. Kontynuując przeglądanie witryny, zgadzasz się na naszą <a href="./polityka-prywatnosci.html" target="_blank" aria-label="Polityka prywatności">politykę prywatności</a>.</p>
            <button class="cookie-btn accept-btn" aria-label="Przycisk akceptacji">Akceptuj</button>
            <button class="cookie-btn cancel-btn" aria-label="Przycisk anulowania">Anuluj</button>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/js/bootstrap.min.js" integrity="sha384-oesi62hOLfzrys4LxRF63OJCXdXDipiYWBnvTl9Y9/TRlw5xlKIEHpNyvvDShgf/" crossorigin="anonymous"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/privacy.js"></script>
    <script src="./scripts/button.js"></script>
    <script src="./scripts/modernizr-custom.js"></script>
</body>

</html>
